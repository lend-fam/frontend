name: Deploy to Server (Production)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
        
    - name: Cache Bun dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.bun/install/cache
          node_modules
        key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-
          
    - name: Install dependencies
      run: bun install --frozen-lockfile
      
    - name: Cache build info
      run: |
        echo "Cache key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}"
        echo "Dependencies installed at: $(date)"
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/lend-family-app:latest
          ${{ secrets.DOCKER_USERNAME }}/lend-family-app:prod-${{ github.sha }}
        build-args: |
          BUILD_MODE=prod
          VITE_APP_ENVIRONMENT=production
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /opt/lend-fam
          export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          # Pull the latest production image
          docker pull ${{ secrets.DOCKER_USERNAME }}/lend-family-app:latest
          # Start/restart only the production frontend service (keeps development running)
          docker compose up --no-deps -d frontend-production
          # Start reproxy if not running
          docker compose up -d reproxy
          # Cleanup unused images
          docker system prune -f