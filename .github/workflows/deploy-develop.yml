name: Deploy to Server (Develop)

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/lend-family-app:develop
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          mkdir -p /opt/lend-family
          cd /opt/lend-family
          
          # Create docker-compose.develop.yml if it doesn't exist
          cat > docker-compose.develop.yml << EOF
          version: '3.8'
          
          services:
            frontend:
              image: ${{ secrets.DOCKER_USERNAME }}/lend-family-app:develop
              container_name: lend-family-app-develop
              labels:
                - "reproxy.server=app.lend.family"
                - "reproxy.route=^/(.*)"
                - "reproxy.dest=/"
              restart: unless-stopped
              networks:
                - reproxy
          
          networks:
            reproxy:
              external: true
          EOF
          
          docker pull ${{ secrets.DOCKER_USERNAME }}/lend-family-app:develop
          docker compose -f docker-compose.develop.yml down
          docker compose -f docker-compose.develop.yml up -d
          docker system prune -f