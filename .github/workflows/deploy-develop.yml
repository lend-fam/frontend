name: Deploy to Server (Develop)

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
        
    - name: Cache Bun dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.bun/install/cache
          node_modules
        key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-
          
    - name: Install dependencies
      run: bun install --frozen-lockfile
      
    - name: Cache build info
      run: |
        echo "Cache key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}"
        echo "Dependencies installed at: $(date)"
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/lend-family-app:develop
          ${{ secrets.DOCKER_USERNAME }}/lend-family-app:develop-${{ github.sha }}
        build-args: |
          BUILD_MODE=develop
          VITE_APP_ENVIRONMENT=develop
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /opt/lend-fam
          export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          echo "🚀 Deploying development build with commit ${{ github.sha }}"
          
          # Stop the current development container
          docker compose stop frontend-development || true
          docker compose rm -f frontend-development || true
          
          # Pull the latest development image (force fresh pull)
          docker pull ${{ secrets.DOCKER_USERNAME }}/lend-family-app:develop
          
          # Clear any cached images
          docker image rm ${{ secrets.DOCKER_USERNAME }}/lend-family-app:develop-old || true
          
          # Tag current image as old for rollback capability
          docker tag ${{ secrets.DOCKER_USERNAME }}/lend-family-app:develop ${{ secrets.DOCKER_USERNAME }}/lend-family-app:develop-old || true
          
          # Start the development frontend service (fresh container)
          docker compose up --no-deps -d frontend-development
          
          # Ensure reproxy is running
          docker compose up -d reproxy
          
          # Verify the deployment
          sleep 5
          if docker compose ps frontend-development | grep -q "Up"; then
            echo "✅ Development frontend deployed successfully"
          else
            echo "❌ Development frontend deployment failed"
            docker compose logs frontend-development
            exit 1
          fi
          
          # Cleanup unused images (but keep the old tag for rollback)
          docker system prune -f --volumes=false
          
          echo "🎉 Development deployment complete! Visit https://lend.family/development"