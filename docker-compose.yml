version: '3.8'

services:
  frontend:
    build: .
    container_name: lend-family-app
    labels:
      - "reproxy.server=lend.family"
      - "reproxy.route=^/(.*)"
      - "reproxy.dest=/"
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ssl_certs:/srv/var/ssl
    restart: unless-stopped
    networks:
      - reproxy

networks:
  reproxy:
    external: true

volumes:
  ssl_certs:
    driver: local