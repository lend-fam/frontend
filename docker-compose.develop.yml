version: '3.8'

services:
  frontend:
    image: ${DOCKER_USERNAME}/lend-family-app:develop
    container_name: lend-family-app-develop
    labels:
      - "reproxy.server=app.lend.family"
      - "reproxy.route=^/(.*)"
      - "reproxy.dest=/"
    ports:
      - "80:8080"
      - "443:8443"
    restart: unless-stopped
    networks:
      - reproxy

networks:
  reproxy:
    external: true