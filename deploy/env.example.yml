# Spot Environment Variables Template
# Copy this to env.yml and fill in actual values

vars:
  # Server Configuration
  SERVER_HOST: your-server-ip
  STAGING_HOST: your-staging-server-ip
  
  # SSH Configuration  
  SSH_PUBLIC_KEY: "ssh-rsa AAAAB3NzaC1... your-public-key-here"
  
  # Docker Configuration
  DOCKER_USERNAME: your-docker-username
  
  # Grafana Cloud Monitoring
  GRAFANA_CLOUD_PROMETHEUS_URL: https://prometheus-prod-01-eu-west-0.grafana.net
  GRAFANA_CLOUD_PROMETHEUS_USERNAME: your-grafana-username
  GRAFANA_CLOUD_API_KEY: your-grafana-api-key
  
  # Cluster Configuration
  CLUSTER_NAME: lend-fam
  ENVIRONMENT: production
  REGION: us-east-1