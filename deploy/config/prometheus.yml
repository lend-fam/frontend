global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: '${CLUSTER_NAME:-lend-fam}'
    environment: '${ENVIRONMENT:-production}'
    region: '${REGION:-unknown}'

# Grafana Cloud remote write configuration
remote_write:
  - url: '${GRAFANA_CLOUD_PROMETHEUS_URL}/api/prom/push'
    basic_auth:
      username: '${GRAFANA_CLOUD_PROMETHEUS_USERNAME}'
      password: '${GRAFANA_CLOUD_API_KEY}'
    queue_config:
      capacity: 10000
      max_samples_per_send: 2000
      batch_send_deadline: 5s
      min_backoff: 30ms
      max_backoff: 5s
      retry_on_http_429: true
    # Filter metrics to reduce costs - allow essential metrics
    write_relabel_configs:
      # Allow basic infrastructure metrics
      - source_labels: [__name__]
        regex: '(up|node_.*|container_memory_usage_bytes|container_cpu_usage_seconds_total|container_network_receive_bytes_total|container_network_transmit_bytes_total|container_last_seen|container_start_time_seconds|prometheus_.*|probe_.*)'
        action: keep
      # Add readable service names for containers
      - source_labels: [container_label_com_docker_compose_service]
        regex: '(.+)'
        target_label: service
        replacement: '${1}'
      - source_labels: [name]
        regex: '(.+)'
        target_label: container_name
        replacement: '${1}'

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
    metrics_path: /metrics

  # Node Exporter - System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          node: 'lend-fam-server'
    scrape_interval: 15s
    metrics_path: /metrics

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s
    metrics_path: /metrics
    metric_relabel_configs:
      # Add readable service names from compose labels
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
        regex: '(.+)'
        replacement: '${1}'
      # Add container name as label
      - source_labels: [name]
        target_label: container_name
        regex: '(.+)'
        replacement: '${1}'
      # Drop metrics for root container to reduce noise
      - source_labels: [id]
        regex: '/'
        action: drop

  # Blackbox Exporter - Website monitoring
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://lend.family
        - https://lend.family/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
    scrape_interval: 30s
    
  # Blackbox Exporter - SSL monitoring
  - job_name: 'blackbox-ssl'
    metrics_path: /probe
    params:
      module: [ssl_expiry]
    static_configs:
      - targets:
        - https://lend.family
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
    scrape_interval: 300s  # Check SSL every 5 minutes

  # DNS monitoring disabled for now - HTTPS monitoring provides sufficient coverage

  # Blackbox Exporter itself
  - job_name: 'blackbox-exporter'
    static_configs:
      - targets: ['blackbox-exporter:9115']
    scrape_interval: 30s

# Rule files for alerting (optional)
rule_files:
  # - "rules/*.yml"

# Basic alerting configuration (can be extended)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []